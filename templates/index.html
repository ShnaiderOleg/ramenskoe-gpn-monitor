<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b235c">
  <title>Бензин в {{ city }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">Газпромнефть · {{ city }}</p>
      <h1>Контроль наличия бензина</h1>
      <p class="intro">АИ-92, АИ-95 и АИ-95 G-Drive. Проверка каждые 10 минут.</p>
    </header>

    <section class="controls" aria-label="Управление уведомлениями">
      <button id="subscribe" class="primary">Включить уведомления</button>
      <button id="test">Отправить тест</button>
      <button id="check">Проверить сейчас</button>
      <span id="message" role="status"></span>
    </section>

    <section class="summary" id="summary">
      <div><span>Последняя проверка</span><strong id="last-check">—</strong></div>
      <div><span>Данные источника</span><strong id="source-updated">—</strong></div>
      <div><span>Push-подписки</span><strong id="subscriptions">0</strong></div>
      <div><span>Telegram</span><strong id="telegram-status">—</strong></div>
    </section>

    <p id="error" class="error" hidden></p>
    <section id="stations" class="stations" aria-live="polite"></section>

    <section class="events">
      <h2>Последние появления</h2>
      <div id="event-list" class="event-list"><p class="empty">Событий пока нет.</p></div>
    </section>

    <footer>
      Источник: <a href="https://www.tboo.ru/gpn/" target="_blank" rel="noreferrer">Топливо рядом</a>.
      Данные справочные и могут поступать с задержкой.
    </footer>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
